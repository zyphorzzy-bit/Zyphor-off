<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — Zyphor Cloud</title>

    <link rel="icon" href="assets/logo.png">

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<header class="navbar">

    <a href="index.html" class="logo">

        <img src="assets/logo.png">

        <span>
            Zyphor <b>Cloud</b>
        </span>

    </a>

    <a
        href="index.html"
        class="login"
    >
        Voltar
    </a>

</header>


<main style="
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
">

    <div style="
        width:100%;
        max-width:430px;
        background:#101010;
        border:1px solid #292929;
        border-radius:20px;
        padding:35px;
    ">

        <small style="
            color:#777;
            letter-spacing:2px;
        ">
            ÁREA DO CLIENTE
        </small>


        <h1 style="
            font-size:38px;
            margin:10px 0;
        ">
            Bem-vindo.
        </h1>


        <p style="
            color:#777;
            margin-bottom:25px;
        ">
            Entre na sua conta da Zyphor Cloud.
        </p>


        <form id="loginForm">

            <label style="
                display:block;
                color:#aaa;
                font-size:13px;
                margin-bottom:18px;
            ">

                E-mail

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                    style="
                        width:100%;
                        margin-top:7px;
                        padding:14px;
                        background:#080808;
                        border:1px solid #2d2d2d;
                        border-radius:10px;
                        color:white;
                        outline:none;
                    "
                >

            </label>


            <label style="
                display:block;
                color:#aaa;
                font-size:13px;
                margin-bottom:20px;
            ">

                Senha

                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required
                    style="
                        width:100%;
                        margin-top:7px;
                        padding:14px;
                        background:#080808;
                        border:1px solid #2d2d2d;
                        border-radius:10px;
                        color:white;
                        outline:none;
                    "
                >

            </label>


            <button
                type="submit"
                style="
                    width:100%;
                    padding:14px;
                    border:0;
                    border-radius:10px;
                    background:white;
                    color:black;
                    font-weight:bold;
                    cursor:pointer;
                "
            >
                Entrar
            </button>

        </form>


        <p style="
            text-align:center;
            color:#777;
            font-size:13px;
            margin-top:22px;
        ">
            Ainda não possui uma conta?
            <a href="#" style="color:white;">
                Criar conta
            </a>
        </p>

    </div>

</main>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        alert(
            "O sistema de autenticação será conectado na próxima etapa."
        );

    });

</script>

</body>

</html>
