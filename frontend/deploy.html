<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar Bot — Zyphor Cloud</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<div class="dashboard-layout">

    <aside class="sidebar">

        <div class="sidebar-logo">
            ZYPHOR<span>CLOUD</span>
        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="bots.html">
                Meus bots
            </a>

            <a
                href="deploy.html"
                class="active"
            >
                Criar bot
            </a>

            <a href="planos.html">
                Planos
            </a>

            <a href="pagamentos.html">
                Pagamentos
            </a>

            <a href="suporte.html">
                Suporte
            </a>

            <a href="conta.html">
                Minha conta
            </a>

        </nav>

    </aside>


    <main class="dashboard-content">

        <header class="dashboard-header">

            <div>

                <h1>
                    Criar bot
                </h1>

                <p>
                    Importe seu projeto para a Zyphor Cloud.
                </p>

            </div>

        </header>


        <section class="auth-card">

            <form
                id="deploy-form"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="name">
                        Nome do bot
                    </label>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        placeholder="Meu bot"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="deploy-source">
                        Origem do projeto
                    </label>

                    <select
                        id="deploy-source"
                        name="source"
                        required
                    >

                        <option value="github">
                            GitHub
                        </option>

                        <option value="zip">
                            Arquivo ZIP
                        </option>

                    </select>

                </div>


                <div
                    class="form-group"
                    data-source="github"
                >

                    <label for="repository">
                        Repositório GitHub
                    </label>

                    <input
                        id="repository"
                        name="repository"
                        type="text"
                        placeholder="usuario/repositorio"
                    >

                </div>


                <div
                    class="form-group"
                    data-source="github"
                >

                    <label for="branch">
                        Branch
                    </label>

                    <input
                        id="branch"
                        name="branch"
                        type="text"
                        value="main"
                    >

                </div>


                <div
                    class="form-group"
                    data-source="zip"
                    style="display:none;"
                >

                    <label for="zip">
                        Projeto ZIP
                    </label>

                    <input
                        id="zip"
                        name="zip"
                        type="file"
                        accept=".zip"
                    >

                </div>


                <button
                    type="submit"
                    class="button primary"
                >
                    Preparar projeto
                </button>

            </form>

        </section>

    </main>

</div>


<script src="js/api.js"></script>
<script src="js/notifications.js"></script>
<script src="js/deploy.js"></script>

</body>
</html>
