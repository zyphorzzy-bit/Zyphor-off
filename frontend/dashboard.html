<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard — Zyphor Cloud</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<div class="dashboard-layout">

    <aside class="sidebar">

        <div class="sidebar-logo">
            ZYPHOR<span>CLOUD</span>
        </div>

        <nav class="sidebar-nav">

            <a
                href="dashboard.html"
                class="active"
            >
                Dashboard
            </a>

            <a href="bots.html">
                Meus bots
            </a>

            <a href="deploy.html">
                Criar bot
            </a>

            <a href="planos.html">
                Planos
            </a>

            <a href="pagamentos.html">
                Pagamentos
            </a>

            <a href="suporte.html">
                Suporte
            </a>

            <a href="conta.html">
                Minha conta
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a
                href="index.html"
                class="button secondary"
                style="width:100%;"
            >
                Sair
            </a>

        </div>

    </aside>


    <main class="dashboard-content">

        <header class="dashboard-header">

            <div>

                <h1>
                    Dashboard
                </h1>

                <p>
                    Gerencie seus bots e acompanhe sua conta.
                </p>

            </div>

            <a
                href="deploy.html"
                class="button primary"
            >
                + Criar bot
            </a>

        </header>


        <section class="stats-grid">

            <div class="stat-card">

                <span>
                    BOTS
                </span>

                <strong id="bot-count">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    ONLINE
                </span>

                <strong id="online-count">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    ARMAZENAMENTO
                </span>

                <strong id="storage-used">
                    0 MB
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    PLANO
                </span>

                <strong id="plan-name">
                    Free
                </strong>

            </div>

        </section>


        <section class="dashboard-panel">

            <div class="panel-header">

                <h2>
                    Seus bots
                </h2>

                <span>
                    Visão geral
                </span>

            </div>

            <div id="recent-bots">

                <div class="empty-state">

                    <p>
                        Carregando seus bots...
                    </p>

                </div>

            </div>

        </section>

    </main>

</div>


<script src="js/api.js"></script>
<script src="js/notifications.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
