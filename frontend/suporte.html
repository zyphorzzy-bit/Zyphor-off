<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Suporte — Zyphor Cloud</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<div class="dashboard-layout">

    <aside class="sidebar">

        <div class="sidebar-logo">
            ZYPHOR<span>CLOUD</span>
        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="bots.html">
                Meus bots
            </a>

            <a href="deploy.html">
                Criar bot
            </a>

            <a href="planos.html">
                Planos
            </a>

            <a href="pagamentos.html">
                Pagamentos
            </a>

            <a
                href="suporte.html"
                class="active"
            >
                Suporte
            </a>

            <a href="conta.html">
                Minha conta
            </a>

        </nav>

    </aside>


    <main class="dashboard-content">

        <header class="dashboard-header">

            <div>

                <h1>
                    Suporte
                </h1>

                <p>
                    Precisa de ajuda? Abra um atendimento.
                </p>

            </div>

        </header>


        <section class="auth-card">

            <form class="auth-form">

                <div class="form-group">

                    <label for="subject">
                        Assunto
                    </label>

                    <input
                        id="subject"
                        type="text"
                        placeholder="Ex: problema no deploy"
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Categoria
                    </label>

                    <select id="category">

                        <option>
                            Suporte
                        </option>

                        <option>
                            Bug
                        </option>

                        <option>
                            Pagamento
                        </option>

                        <option>
                            Conta
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="message">
                        Mensagem
                    </label>

                    <textarea
                        id="message"
                        rows="7"
                        placeholder="Explique o que aconteceu..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="button primary"
                >
                    Abrir atendimento
                </button>

            </form>

        </section>

    </main>

</div>

</body>
</html>
